; ttyd: web terminal for the workspace user. Picked up by the
; [include] files=/etc/neko/supervisord/*.conf line of neko's supervisord.conf.
;
; - no base path: Traefik strips /ws/<user>/terminal before the request arrives
; - --writable: accept keyboard input (read-only otherwise)
; - --check-origin: refuse WebSocket upgrades whose Origin host differs from Host
; - listens on all interfaces (Traefik reaches it over the per-user Docker network)
; - --ping-interval 30: ttyd hangs up on a client that has not answered a ping within twice
;   the interval (default 5 s, so 10 s). ttyd 1.7.7 ignores the client's PAUSE, so a page that
;   is busy rendering a flood of output cannot slow the stream and would be dropped after 10 s
;   (a reconnect then starts a new shell). 60 s tolerates that and still notices a dead peer.
; - "/bin/bash -l": interactive login shell -> ~/.profile -> ~/.bashrc
[program:ttyd]
environment=HOME="/home/user",USER="user",LOGNAME="user",SHELL="/bin/bash",LANG="C.UTF-8"
command=/usr/bin/ttyd
  --port 7681
  --writable
  --check-origin
  --ping-interval 30
  --cwd /home/user
  /bin/bash -l
directory=/home/user
user=user
autorestart=true
startretries=10
stopsignal=TERM
stopwaitsecs=5
priority=900
stdout_logfile=/var/log/neko/ttyd.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true
