# Traefik dynamic configuration (file provider), mounted read-only into Traefik.
#
# The ForwardAuth middleware lives here, not in the backend's container labels:
# Traefik's Docker provider drops a container that is starting or unhealthy, and
# a middleware defined on it would vanish with it, turning every workspace route
# into a 404. Defined here, it always exists, and a dead backend makes the check
# fail with a 5xx instead. Workspace routers reference it as berth-auth@file.
http:
  middlewares:
    berth-auth:
      forwardAuth:
        address: http://berth:8080/api/auth/check
        # Traefik must fill X-Forwarded-Uri itself; never take it from the client.
        trustForwardHeader: false
        # Only the cookie goes to the backend; the original URI travels in
        # X-Forwarded-Uri.
        authRequestHeaders:
          - Cookie
        # The check replies with a few bytes; refuse to read more than 4 KiB.
        maxResponseBodySize: 4096

  # Catch-all for /ws/. A workspace router exists only while its container is up
  # and healthy; for every other state or name Traefik would answer 404 before any
  # authentication ran, which tells an anonymous caller who has a workspace running
  # (and when). This router has the lowest priority, so each per-user router (a
  # longer rule) still wins when it exists; otherwise the request goes through the
  # same check: no session gets 401, someone else's path gets 403, and only the
  # owner reaches the backend, which answers 404.
  routers:
    berth-ws-fallback:
      entryPoints:
        - web
      rule: PathPrefix(`/ws/`)
      priority: 1
      middlewares:
        - berth-auth
      service: berth-ws-fallback
  services:
    berth-ws-fallback:
      loadBalancer:
        servers:
          - url: http://berth:8080
