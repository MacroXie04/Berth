# Traefik dynamic configuration (file provider), mounted read-only into Traefik.
#
# The ForwardAuth middleware lives here, not in the backend's container labels:
# Traefik's Docker provider drops a container that is starting or unhealthy, and
# a middleware defined on it would vanish with it, turning every workspace route
# into a 404. Defined here, it always exists, and a dead backend makes the check
# fail with a 5xx instead. Workspace routers reference it as berth-auth@file.
http:
  middlewares:
    berth-auth:
      forwardAuth:
        address: http://berth:8080/api/auth/check
        # Traefik must fill X-Forwarded-Uri itself; never take it from the client.
        trustForwardHeader: false
        # Only the cookie goes to the backend; the original URI travels in
        # X-Forwarded-Uri.
        authRequestHeaders:
          - Cookie
        # The check replies with a few bytes; refuse to read more than 4 KiB.
        maxResponseBodySize: 4096

    # Response headers for everything served under /ws/ (ttyd, neko, and the
    # catch-all below). Workspace routers list it right after berth-auth and
    # before StripPrefix; it sits on the response path only, so it changes
    # nothing about what the auth check sees. A header set here replaces the
    # workspace's own, which is the point: the workspace is not trusted.
    #
    #  - Framing. SameSite=Lax does not stop a page on a sibling origin of the same
    #    site (another port or subdomain) from framing the victim's live terminal
    #    or remote browser with the victim's cookies. Only the Berth page itself
    #    (same origin: the SPA frames neko) may frame them. Both forms are sent,
    #    old browsers read X-Frame-Options, the rest frame-ancestors.
    #  - Service workers. A workspace page could register a worker with scope "/"
    #    by sending Service-Worker-Allowed: /, and a worker on "/" would outlive
    #    the workspace, logout and the session and sit in front of the login page
    #    and the app. An empty value deletes the header, which caps a worker's
    #    scope at the directory of its script, i.e. under /ws/<user>/<section>/.
    berth-ws-headers:
      headers:
        customFrameOptionsValue: SAMEORIGIN
        contentSecurityPolicy: "frame-ancestors 'self'"
        customResponseHeaders:
          Service-Worker-Allowed: ""

  # Catch-all for /ws/. A workspace router exists only while its container is up
  # and healthy; for every other state or name Traefik would answer 404 before any
  # authentication ran, which tells an anonymous caller who has a workspace running
  # (and when). Its priority is explicit and low, so each per-user router (the
  # Docker provider's default priority is the rule length, at least 29) still wins
  # when it exists; otherwise the request goes through the same check: no
  # session gets 401, someone else's path gets 403, and only the owner reaches the
  # backend, which answers 404. The web app router (docker-compose.yml,
  # berth-web) has priority 1 and excludes /ws itself: this one must stay above
  # it, so a /ws/ path can never fall through to the app without a check.
  routers:
    berth-ws-fallback:
      entryPoints:
        - web
      rule: PathPrefix(`/ws/`)
      priority: 2
      middlewares:
        - berth-auth
        - berth-ws-headers
      service: berth-ws-fallback
  services:
    berth-ws-fallback:
      loadBalancer:
        servers:
          - url: http://berth:8080
